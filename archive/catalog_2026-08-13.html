  const sr = document.getElementById('fr').value;
  let f = data.filter(d => {
    if (q && ![d.title, d.title_en, d.description, d.organization, d.category].join(' ').toLowerCase().includes(q)) return false;

    return true;
  });
  if (sr === 'priority') f.sort((a, b) => (a.priority || 99) - (b.priority || 99));
